version: "3.8"

services:
  restapp:
    environment:
      - FLASK_PORT
      - VERSION
      - CONTAINER_NAME
    container_name: ${CONTAINER_NAME:-restapp}
    image: cclaurevju/flask_restapi_image:${VERSION}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    networks:
      - app-network

  redis:
    environment:
      - REDIS_PORT
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
